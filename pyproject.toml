[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hotmart-mcp"
version = "0.4.0"
description = "Hotmart API MCP server — sales, subscriptions, club, products, coupons, tickets, and negotiation, auto-generated from the official OpenAPI spec"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Thales Laray" }]
keywords = ["hotmart", "mcp", "fastmcp", "openapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastmcp[apps]>=3.0.0,<4.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.22"]

[project.scripts]
hotmart-mcp = "hotmart_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hotmart_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
